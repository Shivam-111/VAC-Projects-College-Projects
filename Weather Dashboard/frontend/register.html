<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - Weather Intelligence Dashboard</title>
  <link href="style.css" rel="stylesheet" />
  <style>
    .register-page { max-width:480px; margin:60px auto; background:white; padding:24px; border-radius:12px; box-shadow:0 8px 30px rgba(2,6,23,0.08);}    
    .register-page h1{font-family:Outfit, sans-serif; margin-bottom:12px}
  </style>
</head>
<body>
  <div class="register-page">
    <h1>Create an account</h1>
    <form id="regForm">
      <div class="form-row">
        <label for="name">Full name</label>
        <input id="name" name="name" required />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required />
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" required />
      </div>
      <div class="form-row">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" type="password" minlength="6" required />
      </div>
      <div class="form-row">
        <label for="city">City</label>
        <select id="city" name="city">
          <option value="">Select a city</option>
          <option value="Nagpur">Nagpur</option>
          <option value="Mumbai">Mumbai</option>
          <option value="New Delhi">New Delhi</option>
          <option value="Bengaluru">Bengaluru</option>
          <option value="Chennai">Chennai</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="submit" class="auth-btn">Register</button>
        <a class="auth-btn" href="index.html">Cancel</a>
      </div>
      <p id="msg" style="margin-top:12px"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const city = document.getElementById('city').value || '';
      if (!name || !email || !password) { msg.textContent = 'Please fill required fields.'; msg.style.color='red'; return; }
      if (password.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.style.color='red'; return; }
      if (password !== confirm) { msg.textContent = 'Passwords do not match.'; msg.style.color='red'; return; }
      const key = 'weather_users';
      const stored = localStorage.getItem(key);
      const users = stored ? JSON.parse(stored) : [];
      if (users.find(u => u.email === email)) { msg.textContent = 'An account with this email already exists.'; msg.style.color='red'; return; }
      users.push({ id: Date.now(), name, email, password, city, createdAt: new Date().toISOString() });
      localStorage.setItem(key, JSON.stringify(users));
      msg.textContent = 'Registration successful! Redirecting to dashboard...'; msg.style.color='green';
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    });
  </script>
</body>
</html>
